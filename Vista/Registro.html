<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ACERIAS</title>
    <link rel="stylesheet"href="../Assets/css/Registro.css">

</head>

<body>
    <div class="Contenedor-Formulario">
        <h2>Registro de Asociados</h2>
        <form id="FormRegistro" action="" method="POST">
            <div class="grupo-input">
                <label> Ingresar Documento:</label>
                <input Id="Documento" type="number" placeholder="ejemplo: 1052841141">
            </div>
            <div class="grupo-input">
                <label>Nombre:</label>
                <input type="text" id="Nombre" required placeholder="Ingrese nombres completos">
            </div>
            <div class="grupo-input">
                <label>Apellidos:</label>
                <input type="text" id="apellido" required placeholder="Ingrese apellidos completos">
            </div>
            <div class="grupo-input">
                <label>Fecha de Nacimiento</label>
                <input type="date" id="fechanacimiento" required>
            </div>
            <div class="grupo-input">
                <label>Direccion de residencia</label>
                <input type="text" id="DireccionResidencia" requiered placeholder="Ej: calle 11 # 20">
            </div>
            <div class="grupo-input">
                <label>Ciudad: </label>
                <select id="Ciudad" required>
                    <option value="Duitama">Duitama</option>
                    <option value="Paipa">Paipa</option>
                    <option value="Sogamoso">Sogamoso</option>


                </select>
            </div>
            <div class="grupo-input">
                <label>Telefono: </label>
                <input type="text" id="telefono" required placeholder="3113224567">
            </div>
            <div class="grupo-input">
                <label>Email: </label>
                <input type="text" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="grupo-input">
                <label>Genero: </label>

            <div class="opcion-genero">
                <input type="radio" id="femenino" name="genero" values="femenino">
                <label>Femenino</label>
            </div>
            <div class="opcion-genero">
                <input type="radio" id="masculino" name="genero" values="Masculino">
                <label>Masculino</label>
            </div>
            <div class="opcion-genero">
                <input type="radio" id="otro" name="genero" values="Otro">
                <label>Otro</label>
             
            </div>
            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>


        </form>
    </div>

</body>

</html>
