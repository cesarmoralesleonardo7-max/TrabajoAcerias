<!DOCTYPE html>
<html lang="es"> 
<head>
     <meta charset="UTF-8">
    <title>REGISTRO</title>
    <link rel="stylesheet"href="../Assets/css/login.css">
</head>
<body>
    <div>
        <h1> Iniciar Sesión </h1>
        <form Id="FormIniciarSesion" action=""method="POST">
            <div class="Sesion">
                <label>Ingrese su nombre</label>
                <input id="Nombre" type ="text" placeholder="Ej:Carlos Perez ">
            </div>
            <div class="Sesion">
                <label>Ingrese su documento</label>
                <input id="Documento" type="number" required placeholder="Ej:105283493">
            </div>
            <div class="Sesion">
                <label >Ingrese su correo</label>
                <input id="Correo" type="text" required>
            </div>
            <div class="Sesion">
                <label >Ingrese la Contraseña</label>
                <input Id="Contraseña" type="text" required>
            </div>
            <div class="botones">
                <button type="submit">Iniciar sesión </button>
        
            </div>

        </form>
    </div>
</body>
</html>
